spring:
  application:
    name: book-library
  datasource:
    # По умолчанию — Postgres из docker-compose.yml (порт 5434 проброшен из WSL2 наружу).
    url: jdbc:postgresql://localhost:5434/library
    username: library
    password: library
  jpa:
    hibernate:
      # Hibernate схему НЕ создаёт и не меняет — только сверяет сущности со схемой.
      # Схемой управляет Liquibase (тестовая и продовая БД получают одну структуру).
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  # t7 (Б16): basic auth для API. Учётка — для демо-стенда, в проде обычно Bearer/JWT.
  security:
    user:
      name: admin
      password: secret
  rabbitmq:
    # Брокер из docker-compose.yml (в WSL2); в интеграционных тестах — контейнер Testcontainers.
    host: localhost
    port: 5672

# Кастомные настройки обмена событиями (t7): exchange/routing/очередь для события book.created.
app:
  mq:
    exchange: library.events
    created-queue: q.book.created
    created-routing: book.created

server:
  port: 8080

# t8 (Б17): Actuator. По умолчанию через web доступен только health (эндпоинты
# включаются management.endpoints.web.exposure.include). show-details=always — для
# показа на занятии (в проде обычно never или when-authorized: детали раскрывают
# инфраструктуру — версии, состояние БД).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
