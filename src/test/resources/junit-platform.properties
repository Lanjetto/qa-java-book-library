# Параллельный запуск JUnit 5 (t8/Б17). По умолчанию выключен: чтобы он заработал,
# нужен и enabled=true, и явный режим выполнения. Здесь оставлены значения
# same_thread (всё подряд), а параллель включается точечно — аннотацией
# @Execution(CONCURRENT) на классах, которым она безопасна.
#
# Почему не «всё сразу» (mode.classes.default=concurrent)? Параллель обостряет гонки
# за общие ресурсы. В этом проекте тесты делят in-memory H2 (профиль test): при
# одновременном старте нескольких Spring-контекстов Liquibase применяет миграции в одну
# БД (блокировка DATABASECHANGELOG), а @SpringBootTest без отката транзакций пишет данные.
# Правило Б17: сначала изоляция (уникальные ISBN, откат транзакций, отдельный контекст),
# потом параллель. Поэтому CONCURRENT помечаем только по-настоящему изолированные тесты —
# без Spring-контекста и общей БД (например, юнит-тест BookServiceTest с Mockito).
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread

# Пул рабочих потоков: динамический, размер = число ядер * factor (4 CPU * 0.75 = 3).
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=0.75
