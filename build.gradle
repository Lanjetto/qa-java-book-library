plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    // t9 (Б18/Б19): Allure-отчёт + генерация HTML (таски allureReport/allureServe). Версия самого
    // плагина — отдельно от версии allure-junit5 (ниже в allure { version }).
    id 'io.qameta.allure' version '3.2.0'
}

group = 'library'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

springBoot {
    mainClass = 'library.LibraryApplication'
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // t4: доступ к БД (Spring Data JPA + Hibernate), миграции схемы (Liquibase)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.liquibase:liquibase-core'
    // t7: Spring Security (basic auth) + RabbitMQ (событие book.created) — Б16
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    // t8: Actuator — /actuator/health как «точка живости» для smoke-теста (Б17)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // драйверы БД: Postgres — «продовый» профиль; H2 — только для тестов (профиль test)
    runtimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // t9 (Б19): адаптер Allure для JUnit5 — пишет JSON-результаты на каждый тест в allure-results;
    // аннотации @Step/@Description/@Severity/@Epic/@Feature приходят вместе с ним.
    testImplementation 'io.qameta.allure:allure-junit5:2.27.0'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    // t5: REST Assured (Б13), Mockito-юнит сервиса и Instancio (Б14) — генерация случайных данных.
    // Mockito уже приходит в starter-test; пин 5.23.0 — чтобы версии core/junit-jupiter не разъехались.
    testImplementation 'io.rest-assured:rest-assured:5.5.7'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testImplementation 'org.instancio:instancio-junit:5.6.0'
    // t6: Testcontainers (Б15) — интеграционные тесты сами поднимают Postgres-контейнер.
    // spring-boot-testcontainers даёт @ServiceConnection (DataSource настраивается под контейнер автоматически).
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.testcontainers:rabbitmq:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    // t7: @WithMockUser для web-слайсов
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform {
        // Интеграционные тесты (REST Assured против Postgres, позднее — Testcontainers/Rabbit)
        // помечены @Tag("docker") и в локальный прогон НЕ входят (им нужна БД).
        excludeTags 'docker'
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

// Отдельная таска для тегов "docker": локально без Docker её можно прогнать против
// Windows-службы PostgreSQL (см. README ветки), на машине преподавателя — против docker-compose
// или Testcontainers (ветка t6). В `check`/`build` НЕ входит — запускается явно.
tasks.register('integrationTest', Test) {
    description = 'Интеграционные тесты @Tag("docker") — нужна Postgres (compose в WSL либо Testcontainers).'
    group = 'verification'
    // Ручной Test-таске нужно явно указать тестовый source set (Java-плагин делает это сам
    // только для встроенной таски test).
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'docker'
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        // Порог — на юнит-тестируемую логику сервиса. С t4 in-memory хранилище удалено,
        // хранилище заменено репозиторием (его покрывают @DataJpaTest-слайсы и @SpringBootTest).
        // Порог достигается сквозным CRUD-тестом полного контекста (BookApiContextTest).
        rule {
            element = 'CLASS'
            includes = ['library.service.*']
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
        }
    }
}

check {
    dependsOn jacocoTestReport
    dependsOn jacocoTestCoverageVerification
}

// t9 (Б19): Allure. Версия раннера/адаптера — 2.27.0; плагин (autoconfigure) сам добавит
// allure-junit5 к тестам и будет знать, где лежат JSON-результаты.
allure {
    version = '2.27.0'
    autoconfigure = true
    // Ступени @Step требуют load-time weaving через aspectjweaver — плагин добавит javaagent к test JVM.
    aspectjweaver = true
}

// Метаданные отчёта (environment.properties, categories.json) адаптер не генерирует — их кладут
// в $buildDir/allure-results рядом с JSON-результатами ДО генерации HTML. Источник — src/test/resources/allure.
// Плагин 3.2.0: встроенный copyCategories на повторном прогоне валит allureReport
// (маркер-«файл» становится директорией). categories.json и так кладём сами — task ниже
// (copyAllureMeta), поэтому встроенную копию отключаем.
tasks.named('copyCategories') {
    enabled = false
}

def copyAllureMeta = tasks.register('copyAllureMeta', Copy) {
    from 'src/test/resources/allure'
    into layout.buildDirectory.dir('allure-results')
}
tasks.named('allureReport') {
    dependsOn 'test'          // JSON-результаты уже сгенерированы
    dependsOn copyAllureMeta
    doLast {
        // Плагин кладёт отчёт в подпапку …/allure-report/allureReport — поднимаем его содержимое
        // на уровень build/reports/allure-report, чтобы index.html лежал по ожидаемому пути.
        copy {
            from layout.buildDirectory.dir('reports/allure-report/allureReport')
            into layout.buildDirectory.dir('reports/allure-report')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
