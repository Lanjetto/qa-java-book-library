# Postgres 16 для демо-проекта «библиотека книг» (ветки t4+).
# На машине преподавателя Docker живёт в WSL2, поэтому контейнер поднимается оттуда:
#   wsl -e bash -lc "cd ~/book-library && docker compose up -d postgres"
# Порт 5434 проброшен наружу, чтобы Windows-приложения ходили в ту же базу.
services:
  postgres:
    image: postgres:16
    container_name: book-library-postgres
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 5

  # t7 (Б16): RabbitMQ для события book.created. Management UI — http://localhost:15672 (guest/guest).
  rabbitmq:
    image: rabbitmq:3-management
    container_name: book-library-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgres-data:
